name: OutfitEra CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build Backend (Maven)
        working-directory: backend
        run: mvn clean package -DskipTests
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontEnd/package-lock.json
          
      - name: Create default environment files
        working-directory: frontEnd
        run: |
          mkdir -p src/environments
          echo "export const environment = { production: true, apiUrl: 'http://localhost:8080/api' };" > src/environments/environment.ts
          echo "export const environment = { production: false, apiUrl: 'http://localhost:8080/api' };" > src/environments/environment.development.ts

      - name: Build Frontend (Angular)
        working-directory: frontEnd
        run: npm run build

      - name: Build Docker images
        run: docker compose build
